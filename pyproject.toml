[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spinh"
version = "0.1.0"
description = "Spin Hamiltonian parameters from DFT calculations: job setup and fitting"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.8"
dependencies = ["numpy", "scipy", "pyyaml", "matplotlib"]

[project.optional-dependencies]
structure = ["ase"]

[project.scripts]
spinh = "spinh.cli:main"

[tool.setuptools.packages.find]
include = ["spinh*"]

[tool.setuptools.package-data]
spinh = ["templates/*/*"]
