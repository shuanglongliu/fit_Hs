# spinh fit isotropic-exchange:  H = factor sum_k J_k sum_{<ij> in k} S_i . S_j

data: energies.dat     # signed effective spins of every site, then the energy; first line names the unit (eV or Ha)
factor: -2
threshold: null        # cm^-1: leave out configurations more than this above the lowest

pairs:                 # J label: the 1-indexed site pairs that share it
  J1:
    - [ 1, 2 ]
  J2:
    - [ 1, 3 ]
  J3:
    - [ 1, 4 ]
  J4:
    - [ 2, 3 ]
  J5:
    - [ 2, 4 ]
  J6:
    - [ 3, 4 ]
  J7:
    - [ 1, 5 ]
  J8:
    - [ 1, 6 ]
  J9:
    - [ 1, 7 ]
  J10:
    - [ 5, 6 ]
  J11:
    - [ 5, 7 ]
  J12:
    - [ 6, 7 ]
